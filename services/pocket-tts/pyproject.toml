[project]
name = "vera-pocket-tts"
version = "0.1.0"
description = "Loopback-only Pocket TTS speech service for Vera"
requires-python = ">=3.10,<3.15"
dependencies = []

[project.optional-dependencies]
engine = ["pocket-tts==3.1.0"]

[project.scripts]
vera-pocket-tts = "vera_pocket_tts.server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_pocket_tts"]

[tool.uv]
package = true
