name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Recent pull-request runs approach fifteen minutes before persistent
    # verification completes. Keep the full gate bounded while allowing a
    # five-minute margin for two-core runner and cleanup variance.
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # setup-node already restores npm's package cache. Prefer it and avoid
        # unrelated registry audit/funding requests on paid hosted runners.
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run quality gate
        run: npm run check

      - name: Build production output
        run: npm run build

      - name: Verify persistent orchestration
        run: npm run verify:persistent:compiled
